<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#1e1e2e"/>
  <!-- Header bar -->
  <rect width="900" height="70" fill="#313244"/>
  <text x="40" y="30" font-size="13" fill="#6c7086">Slide 1</text>
  <text x="40" y="54" font-size="26" font-weight="bold" fill="#cdd6f4">O projektu</text>

  <!-- Left card: Co to je -->
  <rect x="40" y="100" width="380" height="280" rx="12" fill="#313244" stroke="#45475a" stroke-width="1.5"/>
  <rect x="40" y="100" width="380" height="48" rx="12" fill="#89b4fa"/>
  <rect x="40" y="130" width="380" height="18" fill="#89b4fa"/>
  <text x="230" y="131" font-size="17" font-weight="bold" fill="#1e1e2e" text-anchor="middle">Co to je?</text>

  <text x="60" y="175" font-size="14" fill="#cdd6f4">Webová aplikace pro správu</text>
  <text x="60" y="197" font-size="14" fill="#cdd6f4">a evidenci majetku školy</text>

  <!-- Icons row -->
  <rect x="60" y="220" width="60" height="60" rx="8" fill="#45475a"/>
  <text x="90" y="258" font-size="28" text-anchor="middle" fill="#89b4fa">📚</text>
  <text x="90" y="294" font-size="11" fill="#a6adc8" text-anchor="middle">Učebnice</text>

  <rect x="140" y="220" width="60" height="60" rx="8" fill="#45475a"/>
  <text x="170" y="258" font-size="28" text-anchor="middle" fill="#89b4fa">💻</text>
  <text x="170" y="294" font-size="11" fill="#a6adc8" text-anchor="middle">Počítače</text>

  <rect x="220" y="220" width="60" height="60" rx="8" fill="#45475a"/>
  <text x="250" y="258" font-size="28" text-anchor="middle" fill="#89b4fa">🪑</text>
  <text x="250" y="294" font-size="11" fill="#a6adc8" text-anchor="middle">Nábytek</text>

  <rect x="300" y="220" width="60" height="60" rx="8" fill="#45475a"/>
  <text x="330" y="258" font-size="28" text-anchor="middle" fill="#89b4fa">🔌</text>
  <text x="330" y="294" font-size="11" fill="#a6adc8" text-anchor="middle">Elektronika</text>

  <text x="60" y="335" font-size="13" fill="#a6adc8">Přehledná webová evidence pro celou školu</text>
  <text x="60" y="355" font-size="13" fill="#a6adc8">přístupná z libovolného zařízení</text>

  <!-- Right card: Proč -->
  <rect x="460" y="100" width="400" height="280" rx="12" fill="#313244" stroke="#45475a" stroke-width="1.5"/>
  <rect x="460" y="100" width="400" height="48" rx="12" fill="#a6e3a1"/>
  <rect x="460" y="130" width="400" height="18" fill="#a6e3a1"/>
  <text x="660" y="131" font-size="17" font-weight="bold" fill="#1e1e2e" text-anchor="middle">Proč to vzniklo?</text>

  <!-- Before/After -->
  <rect x="480" y="165" width="160" height="80" rx="8" fill="#45475a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="560" y="188" font-size="12" fill="#f38ba8" text-anchor="middle" font-weight="bold">PŘED</text>
  <text x="560" y="208" font-size="22" text-anchor="middle">📄</text>
  <text x="560" y="232" font-size="11" fill="#a6adc8" text-anchor="middle">Papírové záznamy</text>
  <text x="560" y="248" font-size="11" fill="#a6adc8" text-anchor="middle">nebo Excel tabulky</text>

  <text x="660" y="210" font-size="24" fill="#6c7086" text-anchor="middle">→</text>

  <rect x="680" y="165" width="160" height="80" rx="8" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="760" y="188" font-size="12" fill="#a6e3a1" text-anchor="middle" font-weight="bold">PO</text>
  <text x="760" y="208" font-size="22" text-anchor="middle">🌐</text>
  <text x="760" y="232" font-size="11" fill="#a6adc8" text-anchor="middle">Webová aplikace</text>
  <text x="760" y="248" font-size="11" fill="#a6adc8" text-anchor="middle">— přehledná evidence</text>

  <!-- Benefits -->
  <text x="480" y="278" font-size="13" fill="#cdd6f4">✓ Vědět co máme</text>
  <text x="480" y="300" font-size="13" fill="#cdd6f4">✓ Vědět kde to je</text>
  <text x="480" y="322" font-size="13" fill="#cdd6f4">✓ Vědět kdo za to odpovídá</text>
  <text x="480" y="355" font-size="13" fill="#a6adc8">Škola: SSSVT</text>

  <!-- Footer -->
  <text x="450" y="478" font-size="12" fill="#585b70" text-anchor="middle">Evidence školního majetku — github.com/neneKosiiic/School-Property-Evidence</text>
</svg>
