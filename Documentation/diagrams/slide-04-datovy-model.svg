<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#1e1e2e"/>
  <rect width="900" height="70" fill="#313244"/>
  <text x="40" y="30" font-size="13" fill="#6c7086">Slide 4</text>
  <text x="40" y="54" font-size="26" font-weight="bold" fill="#cdd6f4">Datový model</text>

  <defs>
    <marker id="fk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f9e2af"/>
    </marker>
  </defs>

  <!-- people table -->
  <rect x="40" y="90" width="170" height="230" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="40" y="90" width="170" height="34" rx="8" fill="#89b4fa"/>
  <rect x="40" y="110" width="170" height="14" fill="#89b4fa"/>
  <text x="125" y="114" font-size="14" font-weight="bold" fill="#1e1e2e" text-anchor="middle">people</text>
  <line x1="40" y1="124" x2="210" y2="124" stroke="#89b4fa" stroke-width="1"/>
  <text x="55" y="143" font-size="12" fill="#f9e2af">🔑 id</text>
  <text x="55" y="163" font-size="12" fill="#cdd6f4">first_name</text>
  <text x="55" y="183" font-size="12" fill="#cdd6f4">last_name</text>
  <text x="55" y="203" font-size="12" fill="#cdd6f4">email</text>
  <text x="55" y="223" font-size="12" fill="#cdd6f4">password_hash</text>
  <text x="55" y="243" font-size="12" fill="#cdd6f4">role</text>
  <text x="55" y="263" font-size="12" fill="#cdd6f4">is_active</text>
  <text x="55" y="295" font-size="10" fill="#6c7086">Uživatelé systému</text>

  <!-- rooms table -->
  <rect x="260" y="90" width="185" height="200" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <rect x="260" y="90" width="185" height="34" rx="8" fill="#cba6f7"/>
  <rect x="260" y="110" width="185" height="14" fill="#cba6f7"/>
  <text x="352" y="114" font-size="14" font-weight="bold" fill="#1e1e2e" text-anchor="middle">rooms</text>
  <line x1="260" y1="124" x2="445" y2="124" stroke="#cba6f7" stroke-width="1"/>
  <text x="275" y="143" font-size="12" fill="#f9e2af">🔑 id</text>
  <text x="275" y="163" font-size="12" fill="#cdd6f4">room_name</text>
  <text x="275" y="183" font-size="12" fill="#fab387">🔗 responsible_person_id</text>
  <text x="275" y="205" font-size="10" fill="#6c7086">FK → people</text>
  <text x="275" y="265" font-size="10" fill="#6c7086">Učebny a místnosti</text>

  <!-- categories table -->
  <rect x="260" y="310" width="185" height="120" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <rect x="260" y="310" width="185" height="34" rx="8" fill="#a6e3a1"/>
  <rect x="260" y="330" width="185" height="14" fill="#a6e3a1"/>
  <text x="352" y="334" font-size="14" font-weight="bold" fill="#1e1e2e" text-anchor="middle">categories</text>
  <line x1="260" y1="344" x2="445" y2="344" stroke="#a6e3a1" stroke-width="1"/>
  <text x="275" y="363" font-size="12" fill="#f9e2af">🔑 id</text>
  <text x="275" y="383" font-size="12" fill="#cdd6f4">category_name</text>
  <text x="275" y="405" font-size="10" fill="#6c7086">Počítače, Nábytek…</text>

  <!-- items table -->
  <rect x="510" y="90" width="200" height="280" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <rect x="510" y="90" width="200" height="34" rx="8" fill="#f9e2af"/>
  <rect x="510" y="110" width="200" height="14" fill="#f9e2af"/>
  <text x="610" y="114" font-size="14" font-weight="bold" fill="#1e1e2e" text-anchor="middle">items</text>
  <line x1="510" y1="124" x2="710" y2="124" stroke="#f9e2af" stroke-width="1"/>
  <text x="525" y="143" font-size="12" fill="#f9e2af">🔑 id</text>
  <text x="525" y="163" font-size="12" fill="#cdd6f4">inventory_number</text>
  <text x="525" y="183" font-size="12" fill="#cdd6f4">item_name</text>
  <text x="525" y="203" font-size="12" fill="#cdd6f4">description</text>
  <text x="525" y="223" font-size="12" fill="#fab387">🔗 category_id</text>
  <text x="525" y="240" font-size="10" fill="#6c7086">FK → categories</text>
  <text x="525" y="263" font-size="12" fill="#fab387">🔗 room_id</text>
  <text x="525" y="280" font-size="10" fill="#6c7086">FK → rooms</text>
  <text x="525" y="300" font-size="12" fill="#cdd6f4">is_active</text>
  <text x="525" y="345" font-size="10" fill="#6c7086">Předměty evidence</text>

  <!-- FK arrows -->
  <!-- rooms.responsible_person_id -> people.id -->
  <path d="M260,183 Q235,183 235,157 Q235,143 210,143" stroke="#f9e2af" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#fk)"/>

  <!-- items.room_id -> rooms.id -->
  <path d="M510,270 Q480,270 480,143 Q480,143 445,143" stroke="#f9e2af" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#fk)"/>

  <!-- items.category_id -> categories.id -->
  <path d="M510,223 Q490,223 490,363 Q490,363 445,363" stroke="#f9e2af" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#fk)"/>

  <!-- Legend -->
  <rect x="730" y="100" width="150" height="100" rx="8" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="745" y="120" font-size="12" font-weight="bold" fill="#cdd6f4">Legenda</text>
  <text x="745" y="142" font-size="12" fill="#f9e2af">🔑 primární klíč</text>
  <text x="745" y="162" font-size="12" fill="#fab387">🔗 cizí klíč (FK)</text>
  <line x1="745" y1="180" x2="770" y2="180" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="775" y="184" font-size="11" fill="#a6adc8">relace</text>

  <text x="450" y="478" font-size="12" fill="#585b70" text-anchor="middle">Evidence školního majetku — github.com/neneKosiiic/School-Property-Evidence</text>
</svg>
