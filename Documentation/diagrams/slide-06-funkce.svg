  <rect x="592" y="316" width="255" height="52" rx="8" fill="#313244"/>
  <rect x="592" y="316" width="4" height="52" rx="2" fill="#f38ba8"/>
  <text x="607" y="335" font-size="12" fill="#f38ba8">🗑️ Smazat předmět</text>
  <text x="607" y="354" font-size="11" fill="#a6adc8">Endpoint /delete</text>

  <rect x="592" y="378" width="255" height="52" rx="8" fill="#313244"/>
  <rect x="592" y="378" width="4" height="52" rx="2" fill="#cba6f7"/>
  <text x="607" y="397" font-size="12" fill="#cba6f7">🔍 Sloupce přehledu</text>
  <text x="607" y="416" font-size="11" fill="#a6adc8">Místnost, Třídní, kat. počty</text>

  <text x="450" y="478" font-size="12" fill="#585b70" text-anchor="middle">Evidence školního majetku — github.com/neneKosiiic/School-Property-Evidence</text>
