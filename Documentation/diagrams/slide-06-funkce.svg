  <text x="295" y="211" font-size="11" fill="#cdd6f4">8</text>
  <text x="360" y="211" font-size="11" fill="#cdd6f4">12</text>
  <text x="430" y="211" font-size="11" fill="#cdd6f4">1</text>
  <text x="480" y="211" font-size="11" fill="#cdd6f4">7</text>

  <rect x="55" y="221" width="470" height="28" fill="#1e1e2e"/>
