  <text x="380" y="175" font-size="10" fill="#45475a" text-anchor="end">Blazor + ASP.NET Core</text>

  <!-- Card 2 -->
  <rect x="470" y="95" width="390" height="90" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
