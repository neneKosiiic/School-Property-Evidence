  <text x="110" y="393" font-size="12" fill="#a6adc8">Týmová spolupráce na jednom repozitáři — github.com/neneKosiiic/School-Property-Evidence</text>

  <text x="450" y="478" font-size="12" fill="#585b70" text-anchor="middle">Evidence školního majetku — SSSVT</text>
