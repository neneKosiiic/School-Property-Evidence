  <text x="540" y="268" font-size="12" fill="#a6adc8">načítání dat do komponent</text>
  <text x="852" y="285" font-size="10" fill="#45475a" text-anchor="end">HttpClient · System.Text.Json</text>

  <!-- Card 5 -->
  <rect x="40" y="315" width="820" height="90" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <rect x="40" y="315" width="6" height="90" rx="3" fill="#cba6f7"/>
