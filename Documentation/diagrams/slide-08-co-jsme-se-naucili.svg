<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#1e1e2e"/>
  <rect width="900" height="70" fill="#313244"/>
  <text x="40" y="30" font-size="13" fill="#6c7086">Slide 8</text>
  <text x="40" y="54" font-size="26" font-weight="bold" fill="#cdd6f4">Co jsme se naučili</text>

  <!-- Card 1 -->
  <rect x="40" y="95" width="390" height="90" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
