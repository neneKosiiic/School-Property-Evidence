  <text x="65" y="232" font-size="32">🗄️</text>
  <text x="110" y="230" font-size="13" font-weight="bold" fill="#f9e2af">MySQL přes Entity Framework</text>
  <text x="110" y="250" font-size="12" fill="#a6adc8">ORM mapování, migrace databáze,</text>
