  <text x="380" y="285" font-size="10" fill="#45475a" text-anchor="end">EF Core · Pomelo</text>

  <!-- Card 4 -->
  <rect x="470" y="205" width="390" height="90" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <rect x="470" y="205" width="6" height="90" rx="3" fill="#a6e3a1"/>
  <text x="495" y="232" font-size="32">📡</text>
  <text x="540" y="230" font-size="13" font-weight="bold" fill="#a6e3a1">Blazor ↔ REST API komunikace</text>
